<style>
  :root {
    color-scheme: light;
    --bg: #ECEEF2; --bg-top: #F6F7F9; --surface: #FFFFFF; --ink: #12151C; --ink-2: #3F4554;
    --muted: #6A7080; --line: #DADEE6; --blue: #1428A0; --blue-50: #EEF1FB;
    --shadow: 0 1px 2px rgba(18, 21, 28, .05), 0 6px 22px rgba(18, 21, 28, .07);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 520px) var(--bg);
    color: var(--ink); font-family: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.6;
  }
  .wrap { width: 100%; max-width: 880px; margin-inline: auto; padding-inline: 16px; }
  header { padding: 40px 0 8px; }
  .eyebrow { margin: 0; color: var(--blue); font-weight: 700; font-size: 14px; }
  h1 { margin: 6px 0 0; font-size: clamp(30px, 8vw, 44px); line-height: 1.1; font-weight: 800; }
  .rule { width: 32px; height: 3px; border-radius: 2px; background: var(--blue); margin: 14px 0 14px; }
  header p.lead { margin: 0; color: var(--ink-2); }
  .list { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px; }
  .guide {
    display: grid; grid-template-columns: 1fr; text-decoration: none; color: inherit;
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
    transition: box-shadow .2s, transform .2s;
  }
  .guide:hover { box-shadow: 0 2px 4px rgba(18,21,28,.06), 0 14px 36px rgba(18,21,28,.12); transform: translateY(-1px); }
  .guide:focus-visible { outline: 3px solid #6F87FF; outline-offset: 3px; }
  .guide img { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
  .guide .txt { padding: 16px 18px 18px; display: flex; align-items: center; gap: 12px; }
  .guide .txt > div { flex: 1 1 auto; min-width: 0; }
  .guide .brand { display: block; font-size: 13px; color: var(--muted); font-weight: 500; direction: ltr; text-align: right; letter-spacing: .08em; }
  .guide h2 { margin: 2px 0 0; font-size: 20px; line-height: 1.3; font-weight: 700; }
  .guide .go { flex: 0 0 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
  .guide .go svg { width: 20px; height: 20px; }
  footer { margin: 48px 0 0; padding: 24px 0 36px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
  @media (min-width: 720px) {
    .wrap { padding-inline: 28px; }
    header { padding-top: 64px; }
    .guide { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: center; }
    .guide .txt { padding: 24px 28px; }
    .guide h2 { font-size: 23px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">ניופאן</p>
      <h1>מדריכי התקנה</h1>
      <div class="rule"></div>
      <p class="lead">מדריכים מצולמים, שלב אחרי שלב, למוצרים שלנו.</p>
    </header>
    <ul class="list">
      <li>
        <a class="guide" href="samsung-rf65db970e22eu/">
          <img src="samsung-rf65db970e22eu/img/poster.jpg" width="1280" height="720" alt="">
          <div class="txt">
            <div>
              <span class="brand">SAMSUNG · RF65DB970E22EU</span>
              <h2>איך מחברים את קו המים למקרר</h2>
            </div>
            <span class="go" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            </span>
          </div>
        </a>
      </li>
    </ul>
  </main>
  <footer>
    <div class="wrap">ניופאן — היבואן הרשמי</div>
  </footer>
</body>
</html>
